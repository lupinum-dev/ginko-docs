  - "@lupinum/ginko-content@1.0.0-beta.4"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  "@lupinum/ginko-content": 1.0.0-beta.4
  esbuild: 0.28.2
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24

peerDependencyRules:
  allowedVersions:
    vite: 0.1.24
    vitest: 0.1.24
