name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vite+
        run: npm install --global vite-plus@0.1.24

      - name: Install dependencies
        run: vp install

      - name: Install Chromium
        run: vp exec playwright-core install --with-deps chromium

      - name: Verify release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: vp run release:verify

      - name: Upload release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ginko-docs-release
          if-no-files-found: error
          include-hidden-files: true
          path: |
            layer/.pack/*.tgz
            layer/.pack/release-artifact.json
            layer/.pack/release-certification.json
