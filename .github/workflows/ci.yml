name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.paths.outputs.full }}
    steps:
      - name: Select required lanes
        id: paths
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runAll = context.eventName !== 'pull_request'
            const files = runAll
              ? []
              : await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                })
            const paths = files.map((file) => file.filename)
            const topLevelProseOnly =
              paths.length > 0 &&
              paths.every((path) =>
                /^(?:README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|MAINTAINING\.md$|AGENTS\.md$|CLAUDE\.md$|LICENSE$)/u.test(path),
              )
            core.setOutput('full', String(runAll || !topLevelProseOnly))

  validate:
    name: Release verification
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs
      - run: pnpm exec playwright-core install --with-deps chromium

      - name: Verify release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run release:verify

      - name: Upload certified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ginko-docs-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            layer/.pack/*.tgz
            layer/.pack/release-artifact.json
            layer/.pack/release-certification.json

  pr-verification:
    name: PR verification
    if: always() && github.event_name == 'pull_request'
    needs:
      - classify
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected verification
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL: ${{ needs.classify.outputs.full }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$FULL" = true ]; then test "$VALIDATE_RESULT" = success; else test "$VALIDATE_RESULT" = skipped; fi

  release-authorization:
    name: Release authorization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - classify
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The exact main artifact is certified for protected publishing."
